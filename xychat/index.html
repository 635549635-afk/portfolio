<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="小鱼 Chat 全行级 AI 知识助手体验重构项目">
    <title>小鱼 Chat｜项目详情</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="xychat-frame" aria-labelledby="xychat-title">
      <img class="xychat-frame__background" src="../图片准备/xychat-figma-background.png" alt="">
      <img class="xychat-frame__decoration xychat-frame__decoration--one" src="../图片准备/xychat-decoration-1.svg" alt="">
      <img class="xychat-frame__decoration xychat-frame__decoration--two" src="../图片准备/xychat-decoration-2.svg" alt="">

      <div class="xychat-brand">
        <span class="xychat-brand__avatar" aria-hidden="true">
          <img class="xychat-brand__ring" src="../图片准备/xychat-avatar-ring.svg" alt="">
          <img class="xychat-brand__fish" src="../图片准备/xychat-avatar.png" alt="">
        </span>
        <span>小鱼 Chat</span>
      </div>

      <h1 class="xychat-title" id="xychat-title">
        <span class="xychat-title__line">
          <span>全行级</span><strong>AI</strong>
        </span>
        <span class="xychat-title__line">知识助手体验重构</span>
      </h1>

      <div class="xychat-subtitle">从碎片化问答到全行协同的工作流中心</div>

      <section class="xychat-card" aria-label="项目概览">
        <div class="xychat-card__row xychat-card__row--role">
          <img src="../图片准备/xychat-role.svg" alt="">
          <strong>项目角色：</strong>
          <span>全链路负责人（0-1）</span>
        </div>
        <div class="xychat-card__row xychat-card__row--data">
          <img src="../图片准备/xychat-data.svg" alt="">
          <strong>核心数据：</strong>
          <span>覆盖 1.2W+ 员工 / 问题解决率 58%</span>
          <img class="xychat-card__trend" src="../图片准备/xychat-trend.svg" alt="">
        </div>
        <div class="xychat-card__row xychat-card__row--vision">
          <img src="../图片准备/xychat-vision.svg" alt="">
          <strong>项目愿景：</strong>
          <span>通过重构交互范式，将 6 大孤立系统转化为统一的知识中台，实现业务流与知识流的无缝对接</span>
        </div>
      </section>
    </main>
  </body>
</html>
